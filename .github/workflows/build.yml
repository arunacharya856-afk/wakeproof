name: Build WakeProof APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WakeProof.apk
          gh release create "build-${{ github.run_number }}" WakeProof.apk \
            --title "WakeProof build ${{ github.run_number }}" \
            --notes "Open this page on your phone and tap WakeProof.apk to install." \
            --latest
